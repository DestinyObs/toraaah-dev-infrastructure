user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" '
    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 120;
    client_body_timeout 240s; 
    client_header_timeout 240s;
    send_timeout 240s;

    # ============================================================================
    # SECURITY HEADERS - Protect against common web vulnerabilities
    # ============================================================================
    # Prevents clickjacking attacks by not allowing site to be embedded in iframes
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # Prevents browsers from MIME-sniffing a response away from declared content-type
    add_header X-Content-Type-Options "nosniff" always;
    
    # Enables built-in XSS protection in browsers
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Controls how much referrer information is sent with requests
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Restricts browser features and APIs that can be used
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Hide Nginx version number from error pages and headers (security through obscurity)
    server_tokens off;

    # ============================================================================
    # RATE LIMITING ZONES - Prevents abuse and DDoS attacks
    # ============================================================================
    # Each zone uses binary_remote_addr (IP address) as the key to track requests
    # Zone size of 10m can store ~160,000 IP addresses
    
    # General rate limit: 10 requests per second per IP
    # Burst allows temporary spikes up to 20 requests before rejecting
    # Applied to most regular endpoints
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=10r/s;
    
    # Strict rate limit for authentication endpoints: 5 requests per minute
    # Very restrictive to prevent brute force attacks on login/admin pages
    # Burst of 10 allows some flexibility but still very limited
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    
    # API rate limit: 30 requests per second
    # Higher limit for API endpoints that need more throughput
    # Burst of 60 allows for temporary traffic spikes
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    
    # Static assets rate limit: 50 requests per second
    # Higher limit since static files (images, CSS, JS) are requested frequently
    # Burst of 100 allows page loads with many assets
    limit_req_zone $binary_remote_addr zone=static_limit:10m rate=50r/s;

    # ============================================================================
    # CONNECTION LIMITING - Prevents resource exhaustion
    # ============================================================================
    # Limits concurrent connections per IP to prevent slowloris attacks
    # Max 10 simultaneous connections per IP address
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    limit_conn conn_limit 10;

    # ============================================================================
    # REQUEST SIZE LIMITS - Prevents buffer overflow attacks
    # ============================================================================
    # Limits the size of client request body buffer (protects against large POST attacks)
    client_body_buffer_size 128k;
    
    # Limits size and number of large client request headers (protects against header attacks)
    large_client_header_buffers 4 16k;

    # ============================================================================
    # COMPRESSION SETTINGS
    # ============================================================================
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ============================================================================
    # BAD BOT BLOCKING - Blocks known malicious user agents
    # ============================================================================
    # Uses regex matching on User-Agent header to identify and block bad actors
    # Returns 403 Forbidden to matching patterns
    map $http_user_agent $bad_bot {
        default 0;                  # Allow by default
        ~*malicious 1;              # Block anything with "malicious" in user agent
        ~*scanner 1;                # Block security scanners
        ~*bot 0;                    # Allow legitimate bots (Google, Bing, etc.)
        ~*crawler 0;                # Allow legitimate crawlers
        ~*spider 0;                 # Allow legitimate spiders
        ~*scraper 1;                # Block content scrapers
    }

    # ============================================================================
    # MAIN HTTPS SERVER - dev.toraaah.com
    # ============================================================================
    server {
        http2 on; # Enable HTTP/2 for better performance and security
        listen 443 ssl;
        server_name dev.toraaah.com;

        # ========================================================================
        # SSL/TLS CONFIGURATION - Secure encrypted connections
        # ========================================================================
        ssl_certificate /etc/letsencrypt/live/toraaah.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/toraaah.com/privkey.pem;

        # Only allow TLS 1.2 and 1.3 (most secure versions)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        
        # Strong cipher suites - prevents weak encryption attacks
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        
        # SSL session caching improves performance by reusing handshake data
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        
        # HSTS - Forces browsers to only use HTTPS for 1 year (prevents SSL stripping)
        # includeSubDomains applies to all subdomains
        # preload allows inclusion in browser HSTS preload lists
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        client_max_body_size 1024M;

        # ========================================================================
        # SECURITY BLOCKS - Prevent malicious traffic
        # ========================================================================
        # Block bad bots identified by the map above
        if ($bad_bot) {
            return 403;
        }

        # Block common exploit attempts and sensitive file access
        # Returns 404 to not reveal that these paths are being protected
        location ~ /(wp-admin|wp-login|xmlrpc\.php|\.env|\.git) {
            return 404;
        }

        # ========================================================================
        # RATE LIMITING - Applied to this server block
        # ========================================================================
        # Apply general rate limiting: 10 req/s with burst of 20
        # nodelay processes burst requests immediately without queuing
        limit_req zone=general_limit burst=20 nodelay;

        # ========================================================================
        # PROXY CONFIGURATION - Forward requests to Next.js application
        # ========================================================================
        location / {
            proxy_pass http://user:3000;
            proxy_http_version 1.1;
            
            # Required for WebSocket support (real-time features)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            
            # Pass original host header to backend
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            
            # Pass protocol information (http/https)
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Pass real client IP address (important for rate limiting and logging)
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Timeout settings prevent hanging connections
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Next.js image optimization endpoint
        # Higher rate limit since images load frequently
        location /_next/image {
            # Apply static assets rate limit: 50 req/s with burst of 100
            limit_req zone=static_limit burst=100 nodelay;
            
            proxy_pass http://user:3000/_next/image;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static files served directly by Nginx (faster than proxy)
        location /static/ {
            # Apply static assets rate limit
            limit_req zone=static_limit burst=100 nodelay;
            
            alias /app/static/;
            
            # Cache static files for 1 year (they should have hashed filenames)
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Analytics endpoints
        location /analytics/ {
            # Apply API rate limit: 30 req/s with burst of 50
            limit_req zone=api_limit burst=50 nodelay;
            
            proxy_pass http://gtm-sst:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Forward cookies for session tracking
            proxy_set_header Cookie $http_cookie;
            proxy_pass_request_body on;
        }

        # Analytics preview endpoint
        location /analytics/preview/ {
            limit_req zone=api_limit burst=50 nodelay;
            
            proxy_pass http://gtm-sst-preview:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_pass_request_body on;
        }
    }

    # ============================================================================
    # MINISTER SUBDOMAIN - minister.dev.toraaah.com
    # ============================================================================
    server {
        http2 on;
        listen 443 ssl;
        server_name minister.dev.toraaah.com;

        # SSL/TLS Configuration (same as main server)
        ssl_certificate /etc/letsencrypt/live/toraaah.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/toraaah.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        client_max_body_size 1024M;

        # Security: Block bad bots
        if ($bad_bot) {
            return 403;
        }

        # Apply general rate limiting
        limit_req zone=general_limit burst=20 nodelay;

        location / {
            proxy_pass http://minister:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /_next/image {
            limit_req zone=static_limit burst=100 nodelay;
            proxy_pass http://minister:3000/_next/image;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ============================================================================
    # MINISTRY SUBDOMAIN - ministry.dev.toraaah.com
    # ============================================================================
    server {
        http2 on;
        listen 443 ssl;
        server_name ministry.dev.toraaah.com;

        # SSL/TLS Configuration (same as main server)
        ssl_certificate /etc/letsencrypt/live/toraaah.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/toraaah.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        client_max_body_size 1024M;

        # Security: Block bad bots
        if ($bad_bot) {
            return 403;
        }

        # Apply general rate limiting
        limit_req zone=general_limit burst=20 nodelay;

        location / {
            proxy_pass http://ministry:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /_next/image {
            limit_req zone=static_limit burst=100 nodelay;
            proxy_pass http://ministry:3000/_next/image;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ============================================================================
    # API SUBDOMAIN - api.dev.toraaah.com
    # Django Backend with Enhanced Security
    # ============================================================================
    server {
        http2 on;
        listen 443 ssl;
        server_name api.dev.toraaah.com;

        # SSL/TLS Configuration
        ssl_certificate /etc/letsencrypt/live/toraaah.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/toraaah.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        client_max_body_size 1024M;

        # Security: Block bad bots
        if ($bad_bot) {
            return 403;
        }

        # Apply API rate limiting: 30 req/s with burst of 60
        # This is stricter than general limit but allows for API traffic patterns
        limit_req zone=api_limit burst=60 nodelay;

        # Main API endpoint
        location / {
            proxy_pass http://backend-web-1:8000/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Django Admin - VERY STRICT RATE LIMITING
        # Admin panels are prime targets for brute force attacks
        # Only 5 requests per minute with small burst to prevent credential stuffing
        location /admin/ {
            limit_req zone=auth_limit burst=10 nodelay;
            
            proxy_pass http://backend-web-1:8000/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Static files for Django
        location /static/ {
            limit_req zone=static_limit burst=100 nodelay;
            alias /app/static/;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # Catch-all server block for PR previews
    server {
        http2 on;
        listen 443 ssl;
        server_name ~^(pr-)(?<pr_number>\d+)(-(?<subdomain>minister|ministry))?\.dev.toraaah\.com$;

        set $pr_number $pr_number;
        set $subdomain $subdomain;
        set $upstream "pr-$pr_number";
        if ($subdomain) {
            set $upstream "$upstream-$subdomain";
        }

        resolver 127.0.0.11 valid=30s;

        ssl_certificate /etc/letsencrypt/live/toraaah.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/toraaah.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        client_max_body_size 1024M;

        if ($bad_bot) {
            return 403;
        }

        limit_req zone=general_limit burst=20 nodelay;

        location / {
            proxy_pass http://$upstream:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /_next/image {
            limit_req zone=static_limit burst=100 nodelay;
            
            proxy_pass http://$upstream:3000/_next/image$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /static/ {
            limit_req zone=static_limit burst=100 nodelay;
            
            alias /app/static/;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    server {
        listen 443 ssl;
        server_name ~^pr-.*\.dev.toraaah\.com$;

        ssl_certificate /etc/letsencrypt/live/toraaah.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/toraaah.com/privkey.pem;

        return 404;
    }

    # ============================================================================
    # HTTP to HTTPS REDIRECTS - Force secure connections
    # All HTTP traffic is permanently redirected to HTTPS (301 status)
    # ============================================================================

    # Main domain redirect
    server {
        listen 80;
        server_name dev.toraaah.com;
        # 301 = Permanent redirect, tells browsers/search engines to always use HTTPS
        return 301 https://$host$request_uri;
    }

    # Minister subdomain redirect
    server {
        listen 80;
        server_name minister.dev.toraaah.com;
        return 301 https://$host$request_uri;
    }

    # Ministry subdomain redirect
    server {
        listen 80;
        server_name ministry.dev.toraaah.com;
        return 301 https://$host$request_uri;
    }

    # API subdomain redirect
    server {
        listen 80;
        server_name api.dev.toraaah.com;
        return 301 https://$host$request_uri;
    }

    # All PR preview subdomain redirects
    # Matches any pr-*.dev.toraaah.com pattern
    server {
        listen 80;
        server_name ~^pr-.*\.dev.toraaah\.com$;
        return 301 https://$host$request_uri;
    }
}





